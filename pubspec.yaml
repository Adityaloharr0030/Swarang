name: garba_song_manager
description: "A Garba singing group management application for managing singers, songs, and lyrics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^18.0.0

  # Database
  drift: ^2.34.3
  sqlite3: ^3.0.0

  # Utilities
  intl: ^0.20.0
  path_provider: ^2.1.0
  path: ^1.9.0
  file_picker: ^8.0.0
  share_plus: ^10.0.0
  shared_preferences: ^2.3.0

  # Icons
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shimmer: ^4.0.0
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

  # Code Generation
  drift_dev: ^2.34.5
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
